[Position]

## Enable positional tracking (lean in/out/side-to-side)
# Setting type: Boolean
# Default value: true
PositionEnabled = true

## Multiplier for lateral (left/right) position
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 3
PositionSensitivityX = 2

## Multiplier for vertical (up/down) position
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 3
PositionSensitivityY = 2

## Multiplier for depth (forward/back) position
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 3
PositionSensitivityZ = 2

## Maximum lateral displacement in meters
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0.01 to 0.5
PositionLimitX = 0.3

## Maximum upward vertical displacement in meters
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0.01 to 0.5
PositionLimitY = 0.15

## Maximum downward vertical displacement in meters
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 0.5
PositionLimitYDown = 0.05

## Maximum forward displacement in meters
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0.01 to 0.5
PositionLimitZ = 0.4

## Maximum backward displacement in meters. Leaning back is restricted more tightly than leaning forward to stop the camera pulling into the player body.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.01 to 0.5
PositionLimitZBack = 0.1

[Sensitivity]

## Yaw (horizontal) rotation sensitivity multiplier. Use negative values to invert axis.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -5 to 5
YawSensitivity = 1

## Pitch (vertical) rotation sensitivity multiplier. Use negative values to invert axis.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -5 to 5
PitchSensitivity = 1

## Roll rotation sensitivity multiplier. Use negative values to invert axis.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -5 to 5
RollSensitivity = 1

[Smoothing]

## Smoothing applied when the tracker runs on this machine (loopback). 0 = no smoothing, 1 = heavy. Covers rotation and position.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
LocalSmoothing = 0

## Smoothing applied when the tracker is a remote device on the network. 0 = no smoothing, 1 = heavy. Covers rotation and position.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
RemoteSmoothing = 0.15

