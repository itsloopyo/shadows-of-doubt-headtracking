## Settings file was created by plugin Head Tracking v0.0.0
## Plugin GUID: com.headtracking.shadowsofdoubt

[Behavior]

## Pause head tracking when the game window loses focus. This prevents unwanted camera movement when switching to other applications.
# Setting type: Boolean
# Default value: true
PauseOnLostFocus = true

## Write the camera rig, frame-phase and pose probes to HeadTracking.log. Only turn this on when asked for a diagnostic log - it writes several lines every few seconds.
# Setting type: Boolean
# Default value: false
DiagnosticLogging = false

[Camera]

## Degrees added to the field of view the game renders with, on top of the Field of View slider in the game's own settings. 0 leaves the game's value alone; raise it to see wider than that slider allows. The game's sprint kick and interaction zoom still work, and the crosshair compensation follows the change automatically.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -30 to 60
FieldOfViewOffset = 0

[CoordinateTransform]

## Invert the yaw (horizontal) axis. Enable if turning your head right makes the camera turn left.
# Setting type: Boolean
# Default value: false
InvertYaw = false

## Invert the pitch (vertical) axis. This is enabled by default to convert OpenTrack coordinates to Unity. Disable if looking up makes the camera look down.
# Setting type: Boolean
# Default value: true
InvertPitch = true

## Invert the roll (tilt) axis. Enable if tilting your head right makes the camera tilt left.
# Setting type: Boolean
# Default value: false
InvertRoll = false

[General]

## Enable head tracking automatically when the game starts. If false, press End to enable manually.
# Setting type: Boolean
# Default value: true
EnabledOnStartup = true

## Yaw mode: true = horizon-locked yaw (default), false = camera-local. Horizon-locked keeps 'up' constant when looking at extreme pitches; camera-local follows the camera's current up-axis. Toggle at runtime with Page Down or Ctrl+Shift+H.
# Setting type: Boolean
# Default value: true
WorldSpaceYaw = true

[Hotkeys]

