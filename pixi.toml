[workspace]
name = "shadows-of-doubt-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Shadows of Doubt using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
restore = "dotnet restore src/ShadowsOfDoubtHeadTracking/ShadowsOfDoubtHeadTracking.csproj"
setup = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1", depends-on = ["restore"] }
build = { cmd = "dotnet build src/ShadowsOfDoubtHeadTracking/ShadowsOfDoubtHeadTracking.csproj -c Release", depends-on = ["setup"] }
# The mod's own tests, then the config tests, among them the differential test in
# tests/config_differential, which holds the frozen legacy reader to the published build's own
# reader on its first-run file and on core's mutation corpus. What the mod does to the camera is
# checked by an in-game pass.
test = { cmd = "dotnet test src/ShadowsOfDoubtHeadTracking.Tests/ShadowsOfDoubtHeadTracking.Tests.csproj -c Release && dotnet test tests/ShadowsOfDoubtHeadTracking.ConfigTests/ShadowsOfDoubtHeadTracking.ConfigTests.csproj -c Release", depends-on = ["build"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
uninstall = "scripts\\uninstall.cmd"
clean = "dotnet clean src/ShadowsOfDoubtHeadTracking/ShadowsOfDoubtHeadTracking.csproj"

# Bump vendored mod-loader copies to latest upstream.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

# Validate release readiness
validate-release = "powershell -ExecutionPolicy Bypass -File scripts/validate-release.ps1"

# Full release workflow (validate, build, package)
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
